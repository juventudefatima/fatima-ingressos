<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0F6B5C" />
    <title>SI-DATA - Sistema de Ingressos Digitais</title>
    <meta name="description" content="Venda, emissão e validação de tickets digitais para eventos" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="manifest" href="manifest.webmanifest" />
    <script>
      // Aplica o tema salvo ANTES do primeiro paint, pra não piscar claro e abc
      // depois escurecer. Mantido em sincronia com src/contexts/ThemeContext.tsx.
      (function () {
        try {
          var stored = localStorage.getItem('sidata-theme')
          var dark = stored ? stored === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
  </head>
  <body class="bg-paper text-ink font-body antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
